monolog:
    handlers:
        main:
            type:         fingers_crossed
            action_level: error
            handler:      nested
        nested:
            type:  stream
            path:  '%env(LOG_URL)%'
            level: debug
        console:
            type:  console

twig:
    default_path: '%kernel.project_dir%/templates'
    cache: false
    debug:            '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    form_themes:
        - 'form/layout.html.twig'
        - 'form/fields.html.twig'
        - 'form/rating.html.twig'

